<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1410" />
    <meta name="color-scheme" content="dark light" />
    <meta name="author" content="Akarsh Sujay Kumar" />
    <meta name="copyright" content="Copyright © 2026 Akarsh Sujay Kumar. All rights reserved." />
    <meta name="description" content="Adaptive Hybrid Post-Quantum Secure Communication System (PQC Secure Comm)" />
    <title>PQC Secure Comm — Chat</title>
    <!-- Pre-paint theme initializer: prevents flash of wrong theme -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('pqc-theme');
          var systemTheme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          var resolved = stored === 'light' ? 'light' : (stored === 'dark' ? 'dark' : systemTheme);
          document.documentElement.dataset.theme = resolved;
          document.documentElement.style.colorScheme = resolved;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', resolved === 'dark' ? '#1a1410' : '#f0e8dc');
          // Preload active theme background
          var link = document.createElement('link');
          link.rel = 'preload';
          link.as = 'image';
          link.href = '/backgrounds/' + resolved + '.jpg';
          document.head.appendChild(link);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
