[project]
name = "pqc-secure-comm-backend"
version = "1.0.0"
description = "Adaptive Hybrid Post-Quantum Secure Communication Backend"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Akarsh Sujay Kumar", email = "akarshsujaykumar.23is@saividya.ac.in" }
]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
